<!DOCTYPE html>
<html class="ar-html" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>1.1 Scan Image to Text</title>
  <link rel="stylesheet" href="../../style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body class="ar-page">

  <!-- Top bar -->
  <div class="ar-topbar">
    <a class="ar-back" href="../index.html" aria-label="Back to Part 1">← Part 1</a>
    <div id="status" class="ar-status" aria-live="polite">Ready</div>
  </div>

  <!-- Pronunciation button (shown when a target is found) -->
  <button id="speakBtn" class="ar-speak-btn" aria-label="Pronounce vocabulary" title="Pronounce vocabulary">🔊</button>

  <!-- Start screen -->
  <div id="start" class="ar-start">
    <div class="ar-start-card">
      <h1>1.1 Scan Image to Text</h1>
      <p class="ar-desc">สแกนภาพเป้าหมาย แล้วคำศัพท์ภาษาอังกฤษจะลอยขึ้นเป็น AR text</p>
      <div class="ar-instructions">
        <strong>วิธีใช้:</strong><br>
        1. กด Start Camera แล้วอนุญาตกล้อง<br>
        2. จ่อกล้องไปที่ภาพเป้าหมาย (target image)<br>
        3. คำศัพท์จะปรากฏเหนือภาพ<br>
        4. กดปุ่ม 🔊 เพื่อฟังการออกเสียง
      </div>
      <button id="startBtn" class="ar-start-btn" type="button"
        style="background:#38bdf8;color:#00111f;width:100%;box-shadow:0 12px 30px rgba(56,189,248,.28)">
        Start Camera
      </button>
      <p class="ar-hint">iPhone/iPad: เปิดใน Safari เพื่อประสิทธิภาพดีที่สุด</p>
      <div id="error" class="ar-error" role="alert"></div>
    </div>
  </div>

  <!-- AR Scene -->
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ../../assets/targets/part1-1.mind; autoStart: false; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.001; filterBeta: 0.01"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: false; antialias: true; alpha: true; precision: mediump"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
  </a-scene>

  <script src="../../script.js"></script>
  <script>
    'use strict';
    const DATA_URL = '../../assets/data/part1-1.json';
    const MIND_URL = '../../assets/targets/part1-1.mind';

    const scene      = document.getElementById('scene');
    const startEl    = document.getElementById('start');
    const startBtn   = document.getElementById('startBtn');
    const errorEl    = document.getElementById('error');
    const statusEl   = document.getElementById('status');
    const speakBtn   = document.getElementById('speakBtn');

    let dataReady    = false;
    let targetsBuilt = false;
    let items        = [];
    let currentWords = '';
    const foundTargets = new Set();

    function setStatus(text, found = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle('found', !!found);
    }

    function showError(message) {
      errorEl.style.display = 'block';
      errorEl.textContent   = message;
    }

    function cleanText(value) {
      return String(value || '').replace(/\s+/g, ' ').trim();
    }

    function waitForScene() {
      return new Promise(resolve => {
        if (scene.hasLoaded) resolve();
        else scene.addEventListener('loaded', resolve, { once: true });
      });
    }

    async function checkMindFile() {
      const r = await fetch(MIND_URL, { method: 'HEAD' });
      if (!r.ok) throw new Error(
        'ไม่พบไฟล์ .mind — กรุณาสร้าง target ด้วย MindAR Compiler แล้ววางไว้ใน assets/targets/'
      );
    }

    async function startAR() {
      try {
        startBtn.disabled    = true;
        errorEl.style.display = 'none';
        setStatus('Starting…');

        await checkMindFile();
        await waitForScene();
        if (!dataReady) await loadData();

        const sys = scene.systems['mindar-image-system'];
        if (!sys) throw new Error('MindAR system is not ready');

        await sys.start();
        startEl.style.display = 'none';
        setStatus('Scanning…');
      } catch (err) {
        console.error(err);
        setStatus('Error');
        showError(err.message || 'Cannot start AR. Please allow camera permission.');
        startBtn.disabled = false;
      }
    }

    scene.addEventListener('arError', () => {
      setStatus('Camera Error');
      showError('Camera access failed. Please allow camera permission and reload.');
    });

    startBtn.addEventListener('click', startAR);

    speakBtn.addEventListener('click', () => {
      if (currentWords) { Speech.speak(currentWords); vibrate(25); }
    });

    // ----------------------------------------------------------------
    // Canvas text rendering
    // ----------------------------------------------------------------
    function getTerms(item) {
      if (Array.isArray(item.terms) && item.terms.length)
        return item.terms.map(cleanText).filter(Boolean);
      if (item.displayText)
        return String(item.displayText).split(',').map(cleanText).filter(Boolean);
      if (item.word) return [cleanText(item.word)];
      return [];
    }

    function makeTextTexture(lines) {
      const canvas = document.createElement('canvas');
      const ctx    = canvas.getContext('2d');
      const width  = 1600;
      canvas.width = width;

      const longest  = lines.reduce((m, l) => Math.max(m, l.length), 0);
      let fontSize   = 100;
      if (lines.length >= 6 || longest >= 26) fontSize = 70;
      else if (lines.length >= 5 || longest >= 22) fontSize = 78;
      else if (lines.length >= 4 || longest >= 18) fontSize = 86;
      else if (lines.length >= 3 || longest >= 14) fontSize = 94;

      const lineH   = Math.round(fontSize * 1.28);
      const height  = Math.max(260, lines.length * lineH + 86);
      canvas.height = height;

      ctx.clearRect(0, 0, width, height);
      ctx.font         = `900 ${fontSize}px system-ui, sans-serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin     = 'round';

      const startY = height / 2 - ((lines.length - 1) * lineH) / 2;
      lines.forEach((line, i) => {
        const y = startY + i * lineH;
        ctx.shadowColor   = 'rgba(8,47,73,.7)';
        ctx.shadowBlur    = 10;
        ctx.shadowOffsetX = 8; ctx.shadowOffsetY = 8;
        ctx.lineWidth     = Math.max(8, Math.round(fontSize * .12));
        ctx.strokeStyle   = 'rgba(0,19,29,.95)';
        ctx.strokeText(line, width / 2, y);
        ctx.shadowBlur = ctx.shadowOffsetX = ctx.shadowOffsetY = 0;
        ctx.fillStyle  = '#38bdf8';
        ctx.fillText(line, width / 2, y);
      });

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      texture.minFilter   = THREE.LinearFilter;
      texture.magFilter   = THREE.LinearFilter;
      return { texture, aspect: canvas.width / canvas.height };
    }

    function buildTextPlane(item) {
      const lines = getTerms(item);
      const group = document.createElement('a-entity');
      group.setAttribute('position', '0 0.02 0.06');
      if (!lines.length) return group;

      const made   = makeTextTexture(lines);
      const w      = 1.08;
      const h      = w / made.aspect;
      const plane  = document.createElement('a-plane');
      plane.setAttribute('geometry', `primitive: plane; width: ${w}; height: ${h}`);
      plane.setAttribute('material', 'shader: flat; transparent: true; alphaTest: 0.02; side: double; depthTest: false; depthWrite: false');
      plane.addEventListener('loaded', () => {
        const mesh = plane.getObject3D('mesh');
        if (!mesh) return;
        mesh.material.map         = made.texture;
        mesh.material.transparent = true;
        mesh.material.needsUpdate = true;
      });
      group.appendChild(plane);
      return group;
    }

    // ----------------------------------------------------------------
    // Target building
    // ----------------------------------------------------------------
    function buildTargets() {
      if (targetsBuilt) return;
      items.forEach(item => {
        const target = document.createElement('a-entity');
        target.setAttribute('mindar-image-target', `targetIndex: ${item.index}`);

        target.addEventListener('targetFound', () => {
          foundTargets.add(item.index);
          currentWords = getTerms(item).join(', ');
          setStatus('Found ✓', true);
          speakBtn.classList.add('visible');
          vibrate(25);

          if (!target.__content) {
            target.__content = buildTextPlane(item);
            target.appendChild(target.__content);
          }
        });

        target.addEventListener('targetLost', () => {
          foundTargets.delete(item.index);
          if (target.__content) {
            target.removeChild(target.__content);
            target.__content = null;
          }
          if (foundTargets.size === 0) {
            setStatus('Scanning…');
            speakBtn.classList.remove('visible');
            currentWords = '';
          }
        });

        scene.appendChild(target);
      });
      targetsBuilt = true;
    }

    async function loadData() {
      const r = await fetch(DATA_URL);
      if (!r.ok) throw new Error('Cannot load part1-1.json');
      items = await r.json();
      if (!Array.isArray(items) || !items.length) throw new Error('part1-1.json has no data');
      buildTargets();
      dataReady = true;
    }

    loadData().catch(err => {
      console.error(err);
      setStatus('Data Error');
      showError(err.message || 'Cannot load AR data.');
    });
  </script>
</body>
</html>
